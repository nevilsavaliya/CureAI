version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HTTP_PORT:-3000}:${PORT:-3000}"
      - "${BACKEND_HTTPS_PORT:-3443}:${SSL_PORT:-3443}"  # HTTPS port
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - SSL_ENABLED=${SSL_ENABLED:-true}
      - SSL_PORT=${SSL_PORT:-3443}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/app/certs}
      - SSL_KEY_FILE=${SSL_KEY_FILE:-server.key}
      - SSL_CERT_FILE=${SSL_CERT_FILE:-server.crt}
      - SSL_CA_FILE=${SSL_CA_FILE:-ca.crt}
      - SSL_DOMAIN=${SSL_DOMAIN:-${SERVER_NAME:-localhost}}
      - SSL_ORGANIZATION=${SSL_ORGANIZATION:-Healthcare Platform}
      - SSL_OU=${SSL_OU:-IT Department}
      - SSL_COUNTRY=${SSL_COUNTRY:-US}
      - SSL_STATE=${SSL_STATE:-State}
      - SSL_CITY=${SSL_CITY:-City}
      - SSL_ALT_NAMES=${SSL_ALT_NAMES:-}
      - SSL_ALT_IPS=${SSL_ALT_IPS:-}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-31536000}
      - HSTS_INCLUDE_SUBDOMAINS=${HSTS_INCLUDE_SUBDOMAINS:-true}
      - HSTS_PRELOAD=${HSTS_PRELOAD:-true}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - FRONTEND_URL=${FRONTEND_URL}
      - API_URL=${API_URL}
      - API_BASE_URL=${API_BASE_URL}
      - SOCKET_URL=${SOCKET_URL}
      - HEALTH_CHECK_URL=${HEALTH_CHECK_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MAILERSEND_API_KEY=${MAILERSEND_API_KEY}
      - MAILERSEND_FROM_EMAIL=${MAILERSEND_FROM_EMAIL}
      - MAILERSEND_FROM_NAME=${MAILERSEND_FROM_NAME}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-100}
      - HOSPITAL_API_KEY_PREFIX=${HOSPITAL_API_KEY_PREFIX:-HK_}
      - HOSPITAL_API_SECRET_LENGTH=${HOSPITAL_API_SECRET_LENGTH:-64}
      - PAYMENT_TIMEOUT_MINUTES=${PAYMENT_TIMEOUT_MINUTES:-10}
      - PAYMENT_POLL_INTERVAL_SECONDS=${PAYMENT_POLL_INTERVAL_SECONDS:-5}
      - PAYMENT_MAX_RETRIES=${PAYMENT_MAX_RETRIES:-3}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - UPI_ID=${UPI_ID}
      - KOTAK_API_BASE_URL=${KOTAK_API_BASE_URL}
      - KOTAK_CLIENT_ID=${KOTAK_CLIENT_ID}
      - KOTAK_CLIENT_SECRET=${KOTAK_CLIENT_SECRET}
      - KOTAK_MERCHANT_VPA=${KOTAK_MERCHANT_VPA}
      - KOTAK_MERCHANT_MOBILE=${KOTAK_MERCHANT_MOBILE}
      - KOTAK_AGGREGATOR_ID=${KOTAK_AGGREGATOR_ID}
      - KOTAK_MERCHANT_ID=${KOTAK_MERCHANT_ID}
      - KOTAK_SECRET_KEY=${KOTAK_SECRET_KEY}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./certs/backend:/app/certs:ro  # SSL certificates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "${HEALTH_CHECK_URL:-https://backend:${SSL_PORT:-3443}/api/health}"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-40s}
    networks:
      - healthcare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.ssl
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${FRONTEND_HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
      - BACKEND_URL=${BACKEND_URL:-https://backend:${SSL_PORT:-3443}}
      - API_URL=${API_URL}
      - SOCKET_URL=${SOCKET_URL}
      - FRONTEND_HEALTH_CHECK_URL=${FRONTEND_HEALTH_CHECK_URL}
      - HTTPS_PORT=${HTTPS_PORT:-443}
      - HTTP_PORT=${HTTP_PORT:-80}
      - SSL_ENABLED=${SSL_ENABLED:-true}
    volumes:
      - ./certs/frontend:/etc/nginx/ssl:ro  # SSL certificates
      - ./frontend/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "${FRONTEND_HEALTH_CHECK_URL:-https://frontend:${HTTPS_PORT:-443}/}", "||", "curl", "-f", "${FRONTEND_HEALTH_CHECK_URL_FALLBACK:-http://frontend:${HTTP_PORT:-80}/}"]
      interval: ${FRONTEND_HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${FRONTEND_HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${FRONTEND_HEALTH_CHECK_RETRIES:-3}
      start_period: ${FRONTEND_HEALTH_CHECK_START_PERIOD:-40s}
    networks:
      - healthcare-network

  # Let's Encrypt certificate manager (for production)
  certbot:
    image: certbot/certbot:${CERTBOT_VERSION:-latest}
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/www:/var/www/certbot
    environment:
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - SERVER_NAME=${SERVER_NAME}
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email -d ${SERVER_NAME}
    profiles:
      - production
    networks:
      - healthcare-network

  # Certificate renewal service
  certbot-renew:
    image: certbot/certbot:${CERTBOT_VERSION:-latest}
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/www:/var/www/certbot
    command: renew --webroot --webroot-path=/var/www/certbot
    profiles:
      - production
    networks:
      - healthcare-network

  # Optional: MongoDB for local development
  mongodb:
    image: mongo:${MONGODB_VERSION:-6}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-healthcare-platform}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - healthcare-network
    profiles:
      - local-db

  # Redis for session management and caching
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-healthcare123}
    command: redis-server --requirepass ${REDIS_PASSWORD:-healthcare123}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - healthcare-network
    profiles:
      - cache

volumes:
  mongodb_data:
  redis_data:

networks:
  healthcare-network:
    driver: bridge