# Netlify deployment configuration for Healthcare Platform Frontend

[build]
  # Build command
  command = "npm run build"
  
  # Directory to publish (Angular build output)
  publish = "dist/healthcare-platform-frontend"
  
  # Base directory for build
  base = "frontend"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"
  
  # Angular CLI version
  NG_CLI_ANALYTICS = "false"

# Redirect rules for Angular SPA
[[redirects]]
  # Handle Angular routing - redirect all routes to index.html
  from = "/*"
  to = "/index.html"
  status = 200
  
# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache control for static assets
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/index.html"
  [headers.values]
    # Don't cache the main HTML file
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Environment-specific redirects for API calls
[[redirects]]
  from = "/api/*"
  to = "https://healthcare-platform-backend.onrender.com/api/:splat"
  status = 200
  force = true
  
# Branch-specific deployments
[context.production]
  command = "npm run build --configuration=production"
  
[context.deploy-preview]
  command = "npm run build --configuration=development"
  
[context.branch-deploy]
  command = "npm run build --configuration=development"