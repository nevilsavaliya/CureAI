<div class="cases-tabs">
  <button 
    *ngFor="let tab of tabs"
    [class.active]="activeFilter === tab.id" 
    (click)="onFilterChange(tab.id)" 
    class="tab-button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle *ngIf="tab.icon === 'pending'" cx="12" cy="12" r="10"></circle>
      <polyline *ngIf="tab.icon === 'pending'" points="12 6 12 12 16 14"></polyline>
      
      <path *ngIf="tab.icon === 'ongoing' || tab.icon === 'treated'" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline *ngIf="tab.icon === 'ongoing' || tab.icon === 'treated'" points="22 4 12 14.01 9 11.01"></polyline>
      
      <ng-container *ngIf="tab.icon === 'all'">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </ng-container>
    </svg>
    <span class="tab-label">{{ tab.label }}</span>
    <span class="tab-count">{{ tab.count }}</span>
  </button>
</div>
