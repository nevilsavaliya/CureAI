<header class="cases-header">
  <div class="header-left">
    <h1>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      My Cases
    </h1>
    <!-- Connection Status Indicator -->
    <div class="connection-status" [ngClass]="{
      'status-connected': connectionStatus === 'connected',
      'status-polling': connectionStatus === 'polling',
      'status-disconnected': connectionStatus === 'disconnected'
    }">
      <span class="status-dot"></span>
      <span class="status-text" *ngIf="connectionStatus === 'connected'">Real-time</span>
      <span class="status-text" *ngIf="connectionStatus === 'polling'">Polling</span>
      <span class="status-text" *ngIf="connectionStatus === 'disconnected'">Offline</span>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-dashboard" (click)="onDashboardClick()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <span class="btn-text">Dashboard</span>
    </button>
    <div class="user-profile">
      <div class="user-avatar">{{ userName.charAt(0) }}</div>
      <span class="user-name">{{ userName }}</span>
    </div>
    <button class="btn-logout" (click)="onLogoutClick()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="btn-text">Logout</span>
    </button>
  </div>
</header>
