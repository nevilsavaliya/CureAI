<div class="forgot-password-container">
  <div class="forgot-password-card">
    <h2>Reset Password</h2>
    
    <!-- Step Indicator -->
    <div class="step-indicator">
      <div class="step" [class.active]="step >= 1" [class.completed]="step > 1">
        <span class="step-number">1</span>
        <span class="step-label">Email</span>
      </div>
      <div class="step-line" [class.completed]="step > 1"></div>
      <div class="step" [class.active]="step >= 2" [class.completed]="step > 2">
        <span class="step-number">2</span>
        <span class="step-label">OTP</span>
      </div>
      <div class="step-line" [class.completed]="step > 2"></div>
      <div class="step" [class.active]="step >= 3">
        <span class="step-number">3</span>
        <span class="step-label">New Password</span>
      </div>
    </div>

    <!-- Step 1: Email -->
    <div *ngIf="step === 1" class="step-content">
      <p class="instruction">Enter your email address to receive an OTP</p>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email"
          placeholder="Enter your email"
          class="form-control"
          (keyup.enter)="requestOTP()"
        />
      </div>
      
      <div class="success-message" *ngIf="message">{{ message }}</div>
      <div class="error-message" *ngIf="error">{{ error }}</div>

      <button (click)="requestOTP()" [disabled]="loading" class="btn-primary">
        {{ loading ? 'Sending...' : 'Send OTP' }}
      </button>
    </div>

    <!-- Step 2: OTP -->
    <div *ngIf="step === 2" class="step-content">
      <p class="instruction">Enter the 6-digit OTP sent to {{ email }}</p>
      <div class="form-group">
        <label for="otp">OTP Code</label>
        <input 
          type="text" 
          id="otp" 
          [(ngModel)]="otp"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
          class="form-control otp-input"
          (keyup.enter)="verifyOTP()"
        />
      </div>
      
      <div class="success-message" *ngIf="message">{{ message }}</div>
      <div class="error-message" *ngIf="error">{{ error }}</div>

      <button (click)="verifyOTP()" [disabled]="loading" class="btn-primary">
        {{ loading ? 'Verifying...' : 'Verify OTP' }}
      </button>
      
      <button (click)="requestOTP()" class="btn-link">Resend OTP</button>
    </div>

    <!-- Step 3: New Password -->
    <div *ngIf="step === 3" class="step-content">
      <p class="instruction">Create your new password</p>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          [(ngModel)]="newPassword"
          placeholder="Enter new password"
          class="form-control"
        />
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          [(ngModel)]="confirmPassword"
          placeholder="Confirm new password"
          class="form-control"
          (keyup.enter)="resetPassword()"
        />
      </div>
      
      <div class="success-message" *ngIf="message">{{ message }}</div>
      <div class="error-message" *ngIf="error">{{ error }}</div>

      <button (click)="resetPassword()" [disabled]="loading" class="btn-primary">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </div>

    <div class="back-link">
      <button (click)="goBack()" class="btn-link">
        {{ step === 1 ? 'Back to Login' : 'Back' }}
      </button>
    </div>
  </div>
</div>
