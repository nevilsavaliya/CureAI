<!-- Loading State -->
<div *ngIf="loading" class="loading-state">
  <div class="stats-grid">
    <div *ngFor="let i of [1,2,3]" class="stat-card-skeleton">
      <div class="skeleton-icon"></div>
      <div class="skeleton-content">
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>
    </div>
  </div>
</div>

<!-- Dashboard Content -->
<div *ngIf="!loading && dashboardData" class="dashboard-container">
  <!-- Stats Cards Row -->
  <div class="stats-row">
    <app-stat-card *ngFor="let stat of dashboardData.stats.slice(0, 3)" [title]="stat.title" [value]="stat.value"
      [subtitle]="stat.subtitle || ''" [icon]="stat.icon" [color]="stat.color" [trend]="stat.trend"
      [loading]="stat.loading || false">
    </app-stat-card>
  </div>

  <!-- Main Dashboard Grid -->
  <div class="dashboard-grid">
    <!-- Left Column - Patient Summary -->
    <div class="dashboard-card chart-card">
      <app-summary-chart [config]="dashboardData.patientSummary" [loading]="loading">
      </app-summary-chart>
    </div>

    <!-- Middle Column - Today's Appointments -->
    <div class="dashboard-card appointments-card">
      <app-appointment-list [config]="dashboardData.todayAppointments"
        (appointmentClick)="onAppointmentClick($event)" (seeAllClick)="goToCases()">
      </app-appointment-list>
    </div>

    <!-- Right Column - Next Patient -->
    <div class="dashboard-card patient-card">
      <app-user-details-panel [config]="dashboardData.nextPatient" [loading]="loading">
      </app-user-details-panel>
    </div>

    <!-- Bottom Left - Patient Reviews -->
    <div class="dashboard-card reviews-card">
      <app-review-metrics [config]="dashboardData.patientReviews" [loading]="loading">
      </app-review-metrics>
    </div>

    <!-- Bottom Middle - Appointment Requests -->
    <div class="dashboard-card requests-card">
      <app-request-list [config]="dashboardData.appointmentRequests" (actionClick)="handleRequestAction($event)"
        (seeAllClick)="goToCases()">
      </app-request-list>
    </div>

    <!-- Bottom Right - Calendar -->
    <div class="dashboard-card calendar-card" *ngIf="dashboardData.calendar">
      <app-calendar-widget [config]="dashboardData.calendar" [loading]="loading"
        (dateClick)="onDateClick($event)" (monthChange)="onMonthChange($event.month, $event.year)">
      </app-calendar-widget>
    </div>
  </div>
</div>
