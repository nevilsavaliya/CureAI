<div 
  class="stat-card" 
  [ngClass]="[getColorClass(), isClickable() ? 'stat-card-clickable' : '']"
  [attr.role]="isClickable() ? 'button' : 'article'"
  [attr.tabindex]="isClickable() ? '0' : null"
  [attr.aria-label]="getAriaLabel()"
  (click)="isClickable() ? onCardClick() : null"
  (keydown.enter)="isClickable() ? onCardClick() : null"
  (keydown.space)="isClickable() ? onCardClick() : null">
  <!-- Loading State -->
  <div *ngIf="loading" class="stat-card-loading" aria-busy="true" aria-live="polite">
    <div class="skeleton-icon" aria-hidden="true"></div>
    <div class="skeleton-content">
      <div class="skeleton-line skeleton-title" aria-hidden="true"></div>
      <div class="skeleton-line skeleton-value" aria-hidden="true"></div>
      <div class="skeleton-line skeleton-subtitle" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Content State -->
  <div *ngIf="!loading" class="stat-card-content">
    <!-- Icon -->
    <div *ngIf="icon" class="stat-icon" aria-hidden="true">
      <svg *ngIf="icon === 'users'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      
      <svg *ngIf="icon === 'patient-icon' || icon === 'patient'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      
      <svg *ngIf="icon === 'appointment-icon' || icon === 'appointment' || icon === 'calendar'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      
      <svg *ngIf="icon === 'cases'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      
      <svg *ngIf="icon === 'check'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      
      <svg *ngIf="icon === 'clock-icon' || icon === 'clock'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      
      <svg *ngIf="icon === 'star'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      
      <svg *ngIf="icon === 'activity'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      
      <svg *ngIf="icon === 'trending-up'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
        <polyline points="17 6 23 6 23 12"></polyline>
      </svg>
      
      <svg *ngIf="icon === 'heart'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </div>

    <!-- Stats Content -->
    <div class="stat-content">
      <h4 class="stat-title">{{ title }}</h4>
      <div class="stat-value-row">
        <p class="stat-value">{{ value }}</p>
        <span *ngIf="trend" class="stat-trend" [ngClass]="getTrendClass()" [attr.aria-label]="'Trend: ' + (trend.direction === 'up' ? 'increased' : 'decreased') + ' by ' + trend.value + ' percent'">
          <span class="trend-icon" aria-hidden="true">{{ getTrendIcon() }}</span>
          <span class="trend-value">{{ formatTrendValue() }}</span>
        </span>
      </div>
      <p *ngIf="subtitle" class="stat-subtitle">{{ subtitle }}</p>
    </div>
  </div>
</div>
