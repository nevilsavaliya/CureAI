<!-- Backdrop -->
<div 
  class="mobile-nav-backdrop" 
  [@fadeIn]="isOpen ? 'open' : 'closed'"
  (click)="closeMenu()"
  *ngIf="isOpen">
</div>

<!-- Mobile Navigation Drawer -->
<nav 
  class="mobile-nav-drawer" 
  [@slideIn]="isOpen ? 'open' : 'closed'"
  [class.open]="isOpen">
  
  <!-- Header -->
  <div class="mobile-nav-header">
    <div class="user-profile">
      <div class="user-avatar">
        {{ userName.charAt(0).toUpperCase() }}
      </div>
      <div class="user-info">
        <div class="user-name">{{ userName }}</div>
        <div class="user-role">{{ userRole | titlecase }}</div>
      </div>
    </div>
    <button class="close-btn" (click)="closeMenu()" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Navigation Items -->
  <div class="mobile-nav-items">
    <button 
      *ngFor="let item of getNavItems()" 
      class="nav-item"
      (click)="navigateTo(item.route)">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <!-- Home icon -->
        <ng-container *ngIf="item.icon === 'home'">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </ng-container>
        <!-- Folder icon -->
        <ng-container *ngIf="item.icon === 'folder'">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </ng-container>
        <!-- Chart icon -->
        <ng-container *ngIf="item.icon === 'chart-line'">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </ng-container>
        <!-- Users icon -->
        <ng-container *ngIf="item.icon === 'users'">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </ng-container>
        <!-- Hospital icon -->
        <ng-container *ngIf="item.icon === 'hospital'">
          <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"></path>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </ng-container>
      </svg>
      <span class="nav-label">{{ item.label }}</span>
      <svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Footer -->
  <div class="mobile-nav-footer">
    <button class="logout-btn" (click)="onLogout()">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Logout</span>
    </button>
  </div>
</nav>
