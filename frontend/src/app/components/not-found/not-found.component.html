<div class="not-found-container">
  <div class="not-found-content">
    <div class="not-found-illustration">
      <img src="assets/illustrations/404-error.svg" alt="Page not found" />
    </div>
    
    <div class="not-found-text">
      <h1 class="not-found-title">404</h1>
      <h2 class="not-found-subtitle">Page Not Found</h2>
      <p class="not-found-message">
        Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
      </p>
    </div>

    <div class="not-found-actions">
      <button class="btn-primary" (click)="goHome()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <span>Go to Home</span>
      </button>
      
      <button class="btn-secondary" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Go Back</span>
      </button>
    </div>

    <div class="not-found-help">
      <p class="help-text">Need help? Here are some useful links:</p>
      <div class="help-links">
        <a routerLink="/login" class="help-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M13.8 12H3"/>
          </svg>
          <span>Login</span>
        </a>
        <a routerLink="/signup" class="help-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          <span>Sign Up</span>
        </a>
        <a routerLink="/hospital/login" class="help-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18M9 8h1m5 0h1M9 12h1m5 0h1M9 16h1m5 0h1M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16"/>
          </svg>
          <span>Hospital Portal</span>
        </a>
      </div>
    </div>
  </div>
</div>
