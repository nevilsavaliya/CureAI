<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGradient2)"/>
  
  <!-- Heartbeat line pattern -->
  <g opacity="0.08">
    <path d="M0 200 L100 200 L120 180 L140 220 L160 200 L800 200" stroke="#10b981" stroke-width="3" fill="none"/>
    <path d="M0 500 L100 500 L120 480 L140 520 L160 500 L800 500" stroke="#667eea" stroke-width="3" fill="none"/>
    <path d="M0 800 L100 800 L120 780 L140 820 L160 800 L800 800" stroke="#10b981" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Doctor 1 (Left) -->
  <g transform="translate(150, 350)">
    <!-- Head -->
    <circle cx="60" cy="60" r="40" fill="#f4a261"/>
    
    <!-- Hair -->
    <path d="M30 45 Q25 25 45 20 Q60 15 70 25 Q85 20 95 35 Q98 50 90 60 L30 45 Z" fill="#2d3748"/>
    
    <!-- Scrubs -->
    <path d="M30 100 L30 280 L45 280 L45 150 L75 150 L75 280 L90 280 L90 100 Q60 95 30 100 Z" fill="#10b981"/>
    
    <!-- Stethoscope -->
    <ellipse cx="60" cy="120" rx="20" ry="5" fill="#374151"/>
    <path d="M40 120 Q38 145 40 165" stroke="#374151" stroke-width="2" fill="none"/>
    <circle cx="40" cy="168" r="5" fill="#374151"/>
  </g>
  
  <!-- Doctor 2 (Center) - Taller -->
  <g transform="translate(320, 300)">
    <!-- Head -->
    <circle cx="80" cy="70" r="45" fill="#fbbf77"/>
    
    <!-- Hair -->
    <path d="M40 50 Q35 30 55 22 Q75 18 90 28 Q105 22 115 40 Q118 58 108 70 L40 50 Z" fill="#4a5568"/>
    
    <!-- White coat -->
    <path d="M40 115 L40 350 L60 350 L60 180 L100 180 L100 350 L120 350 L120 115 Q80 108 40 115 Z" fill="#ffffff"/>
    
    <!-- Coat details -->
    <line x1="60" y1="180" x2="60" y2="350" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="100" y1="180" x2="100" y2="350" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Stethoscope -->
    <ellipse cx="80" cy="140" rx="25" ry="6" fill="#374151"/>
    <path d="M55 140 Q52 175 55 200" stroke="#374151" stroke-width="2.5" fill="none"/>
    <circle cx="55" cy="203" r="6" fill="#374151"/>
  </g>
  
  <!-- Doctor 3 (Right) -->
  <g transform="translate(520, 360)">
    <!-- Head -->
    <circle cx="60" cy="55" r="38" fill="#e8b4a0"/>
    
    <!-- Hair (with cap) -->
    <ellipse cx="60" cy="35" rx="42" ry="20" fill="#667eea"/>
    <path d="M20 35 L100 35 L95 45 L25 45 Z" fill="#5568d3"/>
    
    <!-- Scrubs -->
    <path d="M28 93 L28 270 L43 270 L43 145 L77 145 L77 270 L92 270 L92 93 Q60 88 28 93 Z" fill="#667eea"/>
    
    <!-- Medical cross on scrubs -->
    <rect x="52" y="160" width="3" height="15" fill="#ffffff"/>
    <rect x="46" y="165" width="15" height="3" fill="#ffffff"/>
  </g>
  
  <!-- Medical symbols -->
  <g opacity="0.2">
    <!-- DNA helix -->
    <g transform="translate(100, 700)">
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="#667eea"/>
      <ellipse cx="0" cy="20" rx="8" ry="3" fill="#10b981"/>
      <ellipse cx="0" cy="40" rx="8" ry="3" fill="#667eea"/>
      <path d="M-8 0 Q0 10 8 20 Q0 30 -8 40" stroke="#667eea" stroke-width="2" fill="none"/>
      <path d="M8 0 Q0 10 -8 20 Q0 30 8 40" stroke="#10b981" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Medical cross -->
    <g transform="translate(680, 700)">
      <rect x="18" y="5" width="6" height="30" fill="#10b981"/>
      <rect x="5" y="18" width="30" height="6" fill="#10b981"/>
    </g>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="120" cy="180" r="4" fill="#10b981" opacity="0.3"/>
  <circle cx="680" cy="250" r="3" fill="#667eea" opacity="0.3"/>
  <circle cx="200" cy="850" r="5" fill="#10b981" opacity="0.3"/>
  <circle cx="600" cy="150" r="3" fill="#667eea" opacity="0.3"/>
  <circle cx="150" cy="600" r="4" fill="#10b981" opacity="0.3"/>
</svg>
