<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="doctorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5568d3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGradient)"/>
  
  <!-- Medical cross pattern (subtle) -->
  <g opacity="0.05">
    <path d="M100 100 L100 150 L75 150 L75 175 L100 175 L100 225 L125 225 L125 175 L150 175 L150 150 L125 150 L125 100 Z" fill="#667eea"/>
    <path d="M650 200 L650 250 L625 250 L625 275 L650 275 L650 325 L675 325 L675 275 L700 275 L700 250 L675 250 L675 200 Z" fill="#10b981"/>
    <path d="M200 700 L200 750 L175 750 L175 775 L200 775 L200 825 L225 825 L225 775 L250 775 L250 750 L225 750 L225 700 Z" fill="#667eea"/>
  </g>
  
  <!-- Doctor figure -->
  <g transform="translate(250, 300)">
    <!-- Head -->
    <circle cx="150" cy="80" r="50" fill="#fbbf77"/>
    
    <!-- Hair -->
    <path d="M110 60 Q100 40 120 30 Q140 20 160 25 Q180 20 195 35 Q200 50 190 65 L110 60 Z" fill="#4a5568"/>
    
    <!-- White coat -->
    <path d="M100 130 L100 400 L120 400 L120 200 L180 200 L180 400 L200 400 L200 130 Q150 120 100 130 Z" fill="#ffffff"/>
    
    <!-- Coat collar -->
    <path d="M120 130 L130 150 L150 140 L170 150 L180 130 L150 125 Z" fill="#e2e8f0"/>
    
    <!-- Stethoscope -->
    <ellipse cx="150" cy="160" rx="30" ry="8" fill="#374151"/>
    <path d="M120 160 Q115 200 120 240" stroke="#374151" stroke-width="3" fill="none"/>
    <path d="M180 160 Q185 200 180 240" stroke="#374151" stroke-width="3" fill="none"/>
    <circle cx="120" cy="245" r="8" fill="#374151"/>
    <circle cx="180" cy="245" r="8" fill="#374151"/>
    
    <!-- Arms -->
    <path d="M100 150 L70 200 L75 250 L95 220 L100 180" fill="#fbbf77"/>
    <path d="M200 150 L230 200 L225 250 L205 220 L200 180" fill="#fbbf77"/>
    
    <!-- Clipboard in hand -->
    <rect x="220" y="220" width="40" height="60" rx="3" fill="#cbd5e0"/>
    <rect x="225" y="225" width="30" height="50" fill="#ffffff"/>
    <line x1="230" y1="235" x2="250" y2="235" stroke="#667eea" stroke-width="2"/>
    <line x1="230" y1="245" x2="250" y2="245" stroke="#667eea" stroke-width="2"/>
    <line x1="230" y1="255" x2="245" y2="255" stroke="#667eea" stroke-width="2"/>
  </g>
  
  <!-- Medical icons floating -->
  <g opacity="0.3">
    <!-- Heart -->
    <path d="M100 850 Q100 830 115 830 Q125 830 130 840 Q135 830 145 830 Q160 830 160 850 Q160 870 130 890 Q100 870 100 850 Z" fill="#ef4444"/>
    
    <!-- Plus sign -->
    <g transform="translate(650, 800)">
      <rect x="18" y="10" width="4" height="20" fill="#10b981"/>
      <rect x="10" y="18" width="20" height="4" fill="#10b981"/>
    </g>
    
    <!-- Pill -->
    <ellipse cx="700" cy="150" rx="15" ry="8" transform="rotate(45 700 150)" fill="#3b82f6"/>
    <ellipse cx="700" cy="150" rx="15" ry="8" transform="rotate(45 700 150)" fill="#93c5fd" opacity="0.5"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="200" r="3" fill="#667eea" opacity="0.4"/>
  <circle cx="700" cy="400" r="4" fill="#10b981" opacity="0.4"/>
  <circle cx="150" cy="850" r="2" fill="#667eea" opacity="0.4"/>
  <circle cx="650" cy="650" r="3" fill="#10b981" opacity="0.4"/>
</svg>
