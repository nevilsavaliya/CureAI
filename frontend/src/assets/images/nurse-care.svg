<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGradient4)"/>
  
  <!-- Medical pattern background -->
  <g opacity="0.06">
    <circle cx="150" cy="150" r="40" fill="none" stroke="#667eea" stroke-width="2"/>
    <circle cx="150" cy="150" r="30" fill="none" stroke="#667eea" stroke-width="2"/>
    <circle cx="650" cy="250" r="50" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="650" cy="250" r="35" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="200" cy="800" r="45" fill="none" stroke="#667eea" stroke-width="2"/>
    <circle cx="200" cy="800" r="30" fill="none" stroke="#667eea" stroke-width="2"/>
  </g>
  
  <!-- Nurse figure -->
  <g transform="translate(280, 320)">
    <!-- Head -->
    <circle cx="120" cy="70" r="45" fill="#f4a261"/>
    
    <!-- Hair -->
    <path d="M80 55 Q75 35 95 28 Q115 23 130 33 Q145 28 155 40 Q160 55 150 68 L80 55 Z" fill="#4a5568"/>
    
    <!-- Nurse cap -->
    <ellipse cx="120" cy="40" rx="45" ry="12" fill="#ffffff"/>
    <rect x="115" y="35" width="10" height="8" fill="#ef4444"/>
    
    <!-- Scrubs top -->
    <path d="M75 115 L75 320 L95 320 L95 180 L145 180 L145 320 L165 320 L165 115 Q120 108 75 115 Z" fill="#10b981"/>
    
    <!-- Collar -->
    <path d="M95 115 L105 130 L120 122 L135 130 L145 115 L120 110 Z" fill="#0d9668"/>
    
    <!-- Pocket with pen -->
    <rect x="100" y="200" width="40" height="35" fill="#0d9668" opacity="0.3"/>
    <rect x="115" y="195" width="3" height="25" fill="#3b82f6"/>
    <circle cx="116.5" cy="195" r="2" fill="#3b82f6"/>
    
    <!-- Stethoscope -->
    <ellipse cx="120" cy="145" rx="25" ry="6" fill="#374151"/>
    <path d="M95 145 Q92 180 95 210" stroke="#374151" stroke-width="2.5" fill="none"/>
    <path d="M145 145 Q148 180 145 210" stroke="#374151" stroke-width="2.5" fill="none"/>
    <circle cx="95" cy="213" r="6" fill="#374151"/>
    <circle cx="145" cy="213" r="6" fill="#374151"/>
    
    <!-- Arms -->
    <path d="M75 135 L50 185 L55 230 L72 200 L75 160" fill="#f4a261"/>
    <path d="M165 135 L190 185 L185 230 L168 200 L165 160" fill="#f4a261"/>
    
    <!-- Medical chart in hand -->
    <rect x="45" y="215" width="35" height="50" rx="2" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
    <line x1="50" y1="225" x2="75" y2="225" stroke="#667eea" stroke-width="1.5"/>
    <line x1="50" y1="235" x2="75" y2="235" stroke="#667eea" stroke-width="1.5"/>
    <line x1="50" y1="245" x2="70" y2="245" stroke="#667eea" stroke-width="1.5"/>
    <line x1="50" y1="255" x2="75" y2="255" stroke="#667eea" stroke-width="1.5"/>
  </g>
  
  <!-- Medical equipment -->
  <g transform="translate(550, 450)">
    <!-- IV stand -->
    <line x1="30" y1="0" x2="30" y2="200" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="30" cy="200" r="15" fill="#94a3b8"/>
    
    <!-- IV bag -->
    <rect x="10" y="10" width="40" height="60" rx="5" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
    <rect x="15" y="15" width="30" height="50" fill="#bfdbfe"/>
    
    <!-- IV tube -->
    <path d="M30 70 Q35 100 30 130" stroke="#94a3b8" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Heart rate monitor -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="120" height="80" rx="5" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="5" y="5" width="110" height="60" fill="#0f172a"/>
    
    <!-- Heart rate line -->
    <path d="M10 35 L30 35 L35 25 L40 45 L45 35 L110 35" stroke="#10b981" stroke-width="2" fill="none"/>
    
    <!-- Buttons -->
    <circle cx="20" cy="72" r="3" fill="#ef4444"/>
    <circle cx="35" cy="72" r="3" fill="#10b981"/>
    <circle cx="50" cy="72" r="3" fill="#3b82f6"/>
  </g>
  
  <!-- Medical symbols -->
  <g opacity="0.2">
    <!-- Syringe -->
    <g transform="translate(650, 650)">
      <rect x="0" y="10" width="40" height="8" fill="#94a3b8"/>
      <rect x="35" y="8" width="15" height="12" fill="#cbd5e0"/>
      <rect x="45" y="12" width="3" height="4" fill="#374151"/>
      <circle cx="5" cy="14" r="4" fill="#cbd5e0"/>
    </g>
    
    <!-- Pills -->
    <ellipse cx="150" cy="750" rx="12" ry="6" fill="#3b82f6"/>
    <ellipse cx="180" cy="760" rx="12" ry="6" fill="#ef4444"/>
    <ellipse cx="210" cy="755" rx="12" ry="6" fill="#10b981"/>
  </g>
  
  <!-- Decorative medical crosses -->
  <g opacity="0.15">
    <g transform="translate(680, 200)">
      <rect x="18" y="8" width="4" height="24" fill="#10b981"/>
      <rect x="8" y="18" width="24" height="4" fill="#10b981"/>
    </g>
    
    <g transform="translate(120, 850)">
      <rect x="18" y="8" width="4" height="24" fill="#667eea"/>
      <rect x="8" y="18" width="24" height="4" fill="#667eea"/>
    </g>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="200" cy="200" r="4" fill="#10b981" opacity="0.3"/>
  <circle cx="600" cy="350" r="3" fill="#667eea" opacity="0.3"/>
  <circle cx="250" cy="850" r="5" fill="#10b981" opacity="0.3"/>
  <circle cx="700" cy="750" r="3" fill="#667eea" opacity="0.3"/>
</svg>
