<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Success checkmark animation illustration -->
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="120" fill="url(#successGrad)" opacity="0.1"/>
  <circle cx="150" cy="150" r="90" fill="url(#successGrad)" opacity="0.2"/>
  <circle cx="150" cy="150" r="70" fill="url(#successGrad)"/>
  <path d="M110 150 L135 175 L190 120" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="150" cy="150" r="70" stroke="#10b981" stroke-width="4" fill="none" opacity="0.3"/>
  <circle cx="150" cy="150" r="85" stroke="#10b981" stroke-width="2" fill="none" opacity="0.2"/>
  <circle cx="150" cy="150" r="100" stroke="#10b981" stroke-width="1" fill="none" opacity="0.1"/>
  <g id="sparkles">
    <circle cx="80" cy="80" r="4" fill="#fbbf24"/>
    <circle cx="220" cy="90" r="5" fill="#fbbf24"/>
    <circle cx="70" cy="220" r="4" fill="#fbbf24"/>
    <circle cx="230" cy="210" r="5" fill="#fbbf24"/>
  </g>
</svg>
