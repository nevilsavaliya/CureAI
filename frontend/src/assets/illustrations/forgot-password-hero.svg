<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background Circle -->
  <circle cx="200" cy="150" r="120" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Lock Body -->
  <rect x="160" y="140" width="80" height="90" rx="8" fill="white" opacity="0.95"/>
  
  <!-- Lock Shackle -->
  <path d="M 170 140 Q 170 100, 200 100 Q 230 100, 230 140" stroke="white" stroke-width="12" fill="none" opacity="0.95" stroke-linecap="round"/>
  
  <!-- Keyhole -->
  <circle cx="200" cy="170" r="8" fill="#667eea"/>
  <rect x="196" y="170" width="8" height="20" rx="2" fill="#667eea"/>
  
  <!-- Key -->
  <g transform="translate(250, 180) rotate(-30)">
    <rect x="0" y="-3" width="40" height="6" rx="3" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#667eea"/>
    <rect x="35" y="-6" width="3" height="6" fill="white" opacity="0.9"/>
    <rect x="40" y="-6" width="3" height="6" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Shield -->
  <g transform="translate(120, 80)">
    <path d="M 0 0 L 15 -10 L 30 0 L 30 20 Q 30 35, 15 40 Q 0 35, 0 20 Z" fill="white" opacity="0.85"/>
    <path d="M 8 15 L 13 20 L 22 10" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative Dots -->
  <circle cx="100" cy="100" r="4" fill="white" opacity="0.4"/>
  <circle cx="300" cy="120" r="6" fill="white" opacity="0.3"/>
  <circle cx="280" cy="220" r="5" fill="white" opacity="0.35"/>
  <circle cx="120" cy="240" r="4" fill="white" opacity="0.4"/>
  
  <!-- Email Icon -->
  <g transform="translate(260, 100)">
    <rect x="0" y="0" width="40" height="28" rx="4" fill="white" opacity="0.8"/>
    <path d="M 0 0 L 20 14 L 40 0" stroke="#667eea" stroke-width="2" fill="none"/>
  </g>
</svg>
